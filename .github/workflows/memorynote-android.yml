name: MemoryNote Android
on:
  push:
    branches: [memorynote-android]
    paths: ['MemoryNote/**', '.github/workflows/memorynote-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MemoryNote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and APK
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MemoryNote-1.0.0-test-apk
          path: MemoryNote/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MemoryNote-test-results
          path: MemoryNote/app/build/reports/tests/testDebugUnitTest
