name: Build StudyLog APK
on:
  push:
    branches: [studylog-apk]
    paths: ['StudyLog/**', '.github/workflows/studylog-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore development signing key
        run: base64 --decode StudyLog/signing/studylog.jks.b64 > StudyLog/signing/studylog.jks
      - name: Build
        working-directory: StudyLog
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: StudyLog-APK
          path: StudyLog/app/build/outputs/apk/release/*.apk
