name: Build RoadRide APK
on:
  workflow_dispatch:
  push:
    branches: [roadride-app]
    paths:
      - 'RoadRide/app/**'
      - 'RoadRide/gradle/**'
      - 'RoadRide/*.gradle'
      - '.github/workflows/roadride.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RoadRide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: chmod +x gradlew && ./gradlew assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RoadRide-APK
          path: RoadRide/app/build/outputs/apk/debug/app-debug.apk
