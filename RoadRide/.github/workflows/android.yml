name: Build RoadRide APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: chmod +x gradlew && ./gradlew assembleDebug lintDebug
      - name: Kotlin cadence and routing checks
        run: |
          compiler=$(find "$HOME/.gradle/wrapper/dists" -name kotlin-compiler-embeddable-2.0.20.jar -print -quit)
          test -n "$compiler"
          export ROADRIDE_KOTLIN_LIB="$(dirname "$compiler")"
          scripts/test-cadence-core.sh
          scripts/test-cadence-network.sh
          scripts/test-asset-router.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RoadRide-APK
          path: app/build/outputs/apk/debug/app-debug.apk
